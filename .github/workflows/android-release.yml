name: Android APK release

on:
  push:
    branches: [main, android-build]
  workflow_dispatch: {}

concurrency:
  group: android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Shop-it.apk
          gh release delete android-latest --yes || true
          git push origin :refs/tags/android-latest || true
          gh release create android-latest Shop-it.apk \
            --title "Android build (latest)" \
            --notes "Automatically built from commit ${{ github.sha }} on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
