name: Release

# App updates on main are published. README and docs changes are not a new
# release. Each publish keeps only the three newest releases.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.bump.outputs.name }}
      code: ${{ steps.bump.outputs.code }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: bump
        run: |
          line=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          name="${line%%+*}"
          code="${line#*+}"
          if [ "$code" = "$line" ]; then
            code=1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "Publishing $name"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python for source icon gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify source icon contract
        run: |
          python -m pip install -r tool/icon-requirements.txt
          python tool/validate_app_icons.py
          python tool/check_icon_artwork.py

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

  android:
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.code }}
          cp build/app/outputs/flutter-apk/app-release.apk "ShopIt-${{ needs.version.outputs.name }}.apk"

      - name: Set up Python for APK icon gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify packaged Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tool/icon-requirements.txt
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          python tool/check_android_apk_icons.py --android-apk "ShopIt-${{ needs.version.outputs.name }}.apk" --aapt "$AAPT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ShopIt-${{ needs.version.outputs.name }}.apk

  windows:
    needs: [version, check]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release `
            --build-name=${{ needs.version.outputs.name }} `
            --build-number=${{ needs.version.outputs.code }}

      - name: Set up Python for Windows icon gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify compiled Windows icon
        shell: pwsh
        run: |
          python -m pip install -r tool/native-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Icon checker dependencies failed" }
          $exe = "build/windows/x64/runner/Release/shop_it.exe"
          python tool/check_built_icons.py --windows-exe "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Compiled Windows icon failed" }
          python tool/check_built_version.py --windows-exe "$exe" --expected-version "${{ needs.version.outputs.name }}" --expected-build "${{ needs.version.outputs.code }}"
          if ($LASTEXITCODE -ne 0) { throw "Compiled Windows version failed" }

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ needs.version.outputs.name }}" "installer/shop_it.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows installer payload
        shell: pwsh
        run: |
          # This is a disposable hosted runner, never a user's installed app.
          $installer = (Resolve-Path "build/installer/ShopIt-Setup-${{ needs.version.outputs.name }}.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "ShopIt-icon-verification"
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`""
          $result = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Verification install failed" }
          $exe = Join-Path $target "shop_it.exe"
          python tool/check_built_icons.py --windows-exe "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer-payload icon failed" }
          python tool/check_built_version.py --windows-exe "$exe" --expected-version "${{ needs.version.outputs.name }}" --expected-build "${{ needs.version.outputs.code }}"
          if ($LASTEXITCODE -ne 0) { throw "Installer-payload version failed" }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: build/installer/ShopIt-Setup-${{ needs.version.outputs.name }}.exe

  macos:
    needs: [version, check]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.code }}
          STAGE="$GITHUB_WORKSPACE/build/macos-package"
          mkdir -p "$STAGE"
          cp -R build/macos/Build/Products/Release/ShopIt.app "$STAGE/"
          cp installer/Uninstall-ShopIt.command "$STAGE/"
          chmod +x "$STAGE/Uninstall-ShopIt.command"
          (
            cd "$STAGE"
            zip -r "$GITHUB_WORKSPACE/ShopIt-${{ needs.version.outputs.name }}-macos.zip" \
              ShopIt.app Uninstall-ShopIt.command
          )

      - name: Set up Python for macOS icon gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify compiled and packaged macOS icons
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tool/native-requirements.txt
          PAYLOAD="$RUNNER_TEMP/ShopIt-icon-verification"
          mkdir -p "$PAYLOAD"
          ditto -x -k "ShopIt-${{ needs.version.outputs.name }}-macos.zip" "$PAYLOAD"
          for APP in "build/macos/Build/Products/Release/ShopIt.app" "$PAYLOAD/ShopIt.app"; do
            python tool/check_built_icons.py --macos-app "$APP"
            python tool/check_built_version.py --macos-app "$APP" --expected-version "${{ needs.version.outputs.name }}" --expected-build "${{ needs.version.outputs.code }}"
          done

      - name: Upload Mac app
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: ShopIt-${{ needs.version.outputs.name }}-macos.zip

  ios:
    needs: [version, check]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.code }}

  publish:
    needs: [version, android, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.name }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes="ShopIt ${VERSION}. Install ShopIt-Setup-${VERSION}.exe on Windows, ShopIt-${VERSION}.apk on Android, or unzip ShopIt-${VERSION}-macos.zip on a Mac. Uninstall from Windows Apps and Features (or the Start Menu Uninstall shortcut), from Android/iOS by removing the app, or on a Mac by running Uninstall-ShopIt.command from the zip. Uninstall removes the app and its lists, settings, and data folders."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its packages."
            gh release upload "$TAG" \
              "packages/ShopIt-${VERSION}.apk" \
              "packages/ShopIt-Setup-${VERSION}.exe" \
              "packages/ShopIt-${VERSION}-macos.zip" \
              --clobber
            gh release edit "$TAG" --notes "$notes"
            exit 0
          fi
          gh release create "$TAG" \
            "packages/ShopIt-${VERSION}.apk" \
            "packages/ShopIt-Setup-${VERSION}.exe" \
            "packages/ShopIt-${VERSION}-macos.zip" \
            --title "$VERSION" \
            --notes "$notes"
          # The release section keeps the three newest releases.
          gh release list --limit 50 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[3:] | .[].tagName' \
            | while read -r old; do
                [ -z "$old" ] && continue
                gh release delete "$old" --yes --cleanup-tag
              done
